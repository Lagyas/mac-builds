[package]
name = "xgworks-web"
version = "0.3.0"
edition = "2021"
description = "Browser build of XGWorks NextGen: the xgworks-native app (egui) compiled to WebAssembly, Web MIDI output"

[lib]
crate-type = ["cdylib"]

[dependencies]
xgworks-native = { path = "../xgworks-native" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[profile.release]
opt-level = "s"
lto = true
