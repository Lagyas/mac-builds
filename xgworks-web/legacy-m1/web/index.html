<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XGworks Web Player</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #faf9f7; --panel: #ffffff; --ink: #1a1a1a; --muted: #6b6b6b;
    --line: #e3e0da; --accent: #c0562a; --accent-ink: #fff; --ok: #2f7d4f;
    --roll-bg: #f4f2ee; --roll-grid: #e6e3dd; --playhead: #c0562a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17161a; --panel: #201f25; --ink: #ececf0; --muted: #a0a0ab;
      --line: #343340; --accent: #e0724a; --accent-ink: #1a1008; --ok: #5fcf8a;
      --roll-bg: #15141a; --roll-grid: #2a2933; --playhead: #e0724a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    display: flex; justify-content: center; padding: 24px 16px; }
  main { width: 100%; max-width: 920px; }
  h1 { font-size: 20px; margin: 0 0 2px; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 18px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .04em; }
  select, input[type=file] { width: 100%; font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); }
  .controls { display: flex; gap: 10px; align-items: end; flex-wrap: wrap; }
  .controls > div { flex: 1; min-width: 180px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; align-items: center; }
  button { font: inherit; font-weight: 600; padding: 9px 16px; border-radius: 8px; cursor: pointer; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  button:disabled { opacity: .45; cursor: default; }
  #log { font-size: 13px; color: var(--muted); margin-top: 10px; }
  .pill { display:inline-block; width:9px; height:9px; border-radius:50%; background: var(--muted); margin-right:7px; vertical-align:middle; }
  .pill.on { background: var(--ok); }
  code { background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; font-size: 12px; }

  .layout { display: grid; grid-template-columns: 240px 1fr; gap: 14px; }
  @media (max-width: 720px) { .layout { grid-template-columns: 1fr; } }
  .tracks { max-height: 420px; overflow: auto; }
  .trk { display: flex; align-items: center; gap: 8px; padding: 5px 4px; border-bottom: 1px solid var(--line); font-size: 13px; }
  .trk:last-child { border-bottom: none; }
  .swatch { width: 11px; height: 11px; border-radius: 3px; flex: none; }
  .trk .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .trk .cnt { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }
  .trk button { padding: 2px 8px; font-size: 11px; font-weight: 700; border-radius: 6px; }
  .trk button.active { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  .trk.off .nm, .trk.off .cnt { opacity: .4; }
  .rollwrap { position: relative; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--roll-bg); }
  .rollwrap canvas { display: block; position: absolute; top: 0; left: 0; }
  .rollwrap { height: 380px; }
  .meta { color: var(--muted); font-size: 12px; margin-top: 8px; display: flex; gap: 16px; flex-wrap: wrap; }
  .meta b { color: var(--ink); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<main>
  <h1>XGworks Web Player</h1>
  <p class="sub">Loads an <code>.XWS</code> project or <code>.MID</code> and plays it over Web MIDI, with a track list and piano roll. Core is Rust <code>xgworks-core</code> compiled to WebAssembly.</p>

  <div class="card">
    <div class="controls">
      <div>
        <label for="file">Project / MIDI file</label>
        <input type="file" id="file" accept=".xws,.XWS,.mid,.MID">
      </div>
      <div>
        <label for="out">MIDI output</label>
        <select id="out"><option>— requesting MIDI access —</option></select>
      </div>
    </div>
    <div class="row">
      <button id="play" class="primary" disabled>▶ Play</button>
      <button id="stop" disabled>■ Stop</button>
      <button id="panic" disabled>Panic</button>
    </div>
    <div id="log"><span class="pill" id="pill"></span>starting…</div>
  </div>

  <div class="card" id="stage" style="display:none;">
    <div class="layout">
      <div>
        <label>Tracks — S / M to solo / mute</label>
        <div class="tracks" id="tracks"></div>
      </div>
      <div>
        <label>Piano roll</label>
        <div class="rollwrap"><canvas id="roll"></canvas><canvas id="play-layer"></canvas></div>
        <div class="meta">
          <span>File: <b id="m-file">—</b></span>
          <span>Format: <b id="m-fmt">—</b></span>
          <span>Notes: <b id="m-notes">—</b></span>
          <span>Duration: <b id="m-dur">—</b></span>
        </div>
      </div>
    </div>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const log = (m, ok=false) => { $('log').innerHTML = `<span class="pill ${ok?'on':''}"></span>${m}`; };
const trackColor = (i) => `hsl(${(i*47)%360} 62% 55%)`;

let wasm=null, midi=null, song=null, playing=false, rafId=0, startClock=0, endTimer=null;

async function initWasm(){ const r=await WebAssembly.instantiateStreaming(fetch('xgworks_web.wasm'),{}); wasm=r.instance; }

function parsePlan(bytes){
  const mem=()=>wasm.exports.memory.buffer;
  const inPtr=wasm.exports.xgw_alloc(bytes.length);
  new Uint8Array(mem(),inPtr,bytes.length).set(bytes);
  const base=wasm.exports.xgw_plan(inPtr,bytes.length);
  const dv=new DataView(mem()); const u8=new Uint8Array(mem()); const dec=new TextDecoder();
  let o=base+4;
  const ntr=dv.getUint16(o,true); o+=2;
  const tracks=[];
  for(let i=0;i<ntr;i++){ const ch=u8[o++]; const nl=u8[o++]; const name=dec.decode(u8.subarray(o,o+nl)); o+=nl;
    tracks.push({name,ch,notes:0,muted:false,solo:false}); }
  const nn=dv.getUint32(o,true); o+=4;
  const notes=new Array(nn);
  for(let i=0;i<nn;i++){ const tr=dv.getUint16(o,true);o+=2; const t=dv.getFloat32(o,true);o+=4; const d=dv.getFloat32(o,true);o+=4;
    const p=u8[o++]; const v=u8[o++]; notes[i]={tr,t,d,p,v}; tracks[tr].notes++; }
  const nm=dv.getUint32(o,true); o+=4;
  const msgs=new Array(nm);
  for(let i=0;i<nm;i++){ const tr=dv.getUint16(o,true);o+=2; const t=dv.getFloat32(o,true);o+=4; const len=u8[o++];
    msgs[i]={tr,t,bytes:Uint8Array.from(u8.subarray(o,o+len))}; o+=len; }
  let dur=0, pmin=127, pmax=0;
  for(const n of notes){ dur=Math.max(dur,n.t+n.d); pmin=Math.min(pmin,n.p); pmax=Math.max(pmax,n.p); }
  if(pmin>pmax){ pmin=48; pmax=72; }
  pmin=Math.max(0,pmin-2); pmax=Math.min(127,pmax+2);
  return {tracks,notes,msgs,dur:dur||1,pmin,pmax};
}

// ---- MIDI ----
async function initMidi(){
  try{ midi=await navigator.requestMIDIAccess({sysex:true}); }
  catch(e){ try{ midi=await navigator.requestMIDIAccess({sysex:false}); } catch(e2){ log('Web MIDI unavailable: '+e2.message); return; } }
  refreshOutputs(); midi.onstatechange=refreshOutputs;
  log('MIDI ready ('+(midi.sysexEnabled?'with SysEx':'no SysEx')+'). Load a file.', true);
}
function refreshOutputs(){ const sel=$('out'), prev=sel.value; sel.innerHTML='';
  for(const o of midi.outputs.values()){ const op=document.createElement('option'); op.value=o.id; op.textContent=o.name; sel.appendChild(op); }
  if(!sel.options.length){ const op=document.createElement('option'); op.textContent='No MIDI outputs'; sel.appendChild(op); }
  else if(prev) sel.value=prev;
}
const currentOutput=()=> midi && midi.outputs.get($('out').value);

function audibleTracks(){
  const solos=song.tracks.map(t=>t.solo);
  const anySolo=solos.some(Boolean);
  return song.tracks.map((t,i)=> anySolo ? t.solo : !t.muted);
}

// ---- track list ----
function renderTracks(){
  const host=$('tracks'); host.innerHTML='';
  const aud=audibleTracks();
  song.tracks.forEach((t,i)=>{
    const row=document.createElement('div'); row.className='trk'+(aud[i]?'':' off');
    const sw=document.createElement('span'); sw.className='swatch'; sw.style.background=trackColor(i); row.appendChild(sw);
    const nm=document.createElement('span'); nm.className='nm'; nm.textContent=`${i}. ${t.name}`; nm.title=`ch ${t.ch+1}`; row.appendChild(nm);
    const cnt=document.createElement('span'); cnt.className='cnt'; cnt.textContent=t.notes; row.appendChild(cnt);
    const s=document.createElement('button'); s.textContent='S'; if(t.solo)s.classList.add('active');
    s.onclick=()=>{ t.solo=!t.solo; renderTracks(); drawRoll(); }; row.appendChild(s);
    const m=document.createElement('button'); m.textContent='M'; if(t.muted)m.classList.add('active');
    m.onclick=()=>{ t.muted=!t.muted; renderTracks(); drawRoll(); }; row.appendChild(m);
    host.appendChild(row);
  });
}

// ---- piano roll ----
let RW=600, RH=380;
function sizeCanvas(){
  const wrap=document.querySelector('.rollwrap');
  RW=wrap.clientWidth; RH=wrap.clientHeight;
  const dpr=window.devicePixelRatio||1;
  for(const c of [$('roll'),$('play-layer')]){ c.width=RW*dpr; c.height=RH*dpr; c.style.width=RW+'px'; c.style.height=RH+'px';
    c.getContext('2d').setTransform(dpr,0,0,dpr,0,0); }
}
function xOf(t){ return t/song.dur*RW; }
function yOf(p){ const range=song.pmax-song.pmin+1; return RH - (p-song.pmin+0.5)/range*RH; }
function drawRoll(){
  if(!song) return;
  const ctx=$('roll').getContext('2d'); ctx.clearRect(0,0,RW,RH);
  const style=getComputedStyle(document.documentElement);
  // pitch grid (octaves at C)
  ctx.strokeStyle=style.getPropertyValue('--roll-grid'); ctx.lineWidth=1;
  for(let p=Math.ceil(song.pmin/12)*12; p<=song.pmax; p+=12){ const y=yOf(p); ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(RW,y); ctx.stroke(); }
  const aud=audibleTracks();
  const range=song.pmax-song.pmin+1; const h=Math.max(2, Math.min(9, RH/range)-1);
  for(const n of song.notes){
    const on=aud[n.tr];
    ctx.fillStyle=trackColor(n.tr);
    ctx.globalAlpha=on?(0.45+0.55*(n.v/127)):0.12;
    const x=xOf(n.t), w=Math.max(1.3, xOf(n.t+n.d)-x), y=yOf(n.p)-h/2;
    ctx.fillRect(x,y,w,h);
  }
  ctx.globalAlpha=1;
}
function drawPlayhead(xms){
  const ctx=$('play-layer').getContext('2d'); ctx.clearRect(0,0,RW,RH);
  if(xms==null) return;
  const style=getComputedStyle(document.documentElement);
  const x=xOf(xms); ctx.strokeStyle=style.getPropertyValue('--playhead'); ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,RH); ctx.stroke();
}

// ---- file ----
$('file').addEventListener('change', async e=>{
  const f=e.target.files[0]; if(!f) return;
  const buf=new Uint8Array(await f.arrayBuffer());
  song=parsePlan(buf);
  if(!(midi && midi.sysexEnabled)) song.msgs=song.msgs.filter(m=>m.bytes[0]!==0xF0 && m.bytes[0]!==0xF7);
  const totalNotes=song.notes.length;
  $('m-file').textContent=f.name;
  $('m-fmt').textContent=(buf[0]===0x4D&&buf[1]===0x54)?'Standard MIDI File':'XGworks .XWS';
  $('m-notes').textContent=totalNotes.toLocaleString();
  $('m-dur').textContent=(song.dur/1000).toFixed(1)+' s';
  $('stage').style.display='';
  renderTracks(); sizeCanvas(); drawRoll(); drawPlayhead(null);
  $('play').disabled=false;
  log('Loaded '+f.name+' — '+song.tracks.length+' tracks, '+totalNotes.toLocaleString()+' notes.', true);
});

// ---- transport ----
function setPlaying(on){ playing=on; $('play').disabled=on||!song; $('stop').disabled=!on; $('panic').disabled=!song; }
function tick(){
  if(!playing) return;
  const el=performance.now()-startClock;
  drawPlayhead(el);
  if(el>=song.dur){ setPlaying(false); drawPlayhead(null); log('Finished.', true); return; }
  rafId=requestAnimationFrame(tick);
}
$('play').addEventListener('click', ()=>{
  const out=currentOutput(); if(!out||!song){ log('No output or nothing loaded.'); return; }
  const aud=audibleTracks();
  startClock=performance.now()+150;
  for(const m of song.msgs){ if(aud[m.tr]) out.send(m.bytes, startClock+m.t); }
  setPlaying(true); log('Playing on '+out.name+'…', true);
  clearTimeout(endTimer); endTimer=setTimeout(()=>{setPlaying(false);drawPlayhead(null);log('Finished.',true);}, song.dur+350);
  cancelAnimationFrame(rafId); rafId=requestAnimationFrame(tick);
});
function allOff(){ const out=currentOutput(); if(!out) return; if(out.clear) out.clear();
  for(let ch=0;ch<16;ch++){ out.send([0xB0|ch,120,0]); out.send([0xB0|ch,123,0]); } }
$('stop').addEventListener('click', ()=>{ clearTimeout(endTimer); cancelAnimationFrame(rafId); allOff(); setPlaying(false); drawPlayhead(null); log('Stopped.'); });
$('panic').addEventListener('click', ()=>{ clearTimeout(endTimer); cancelAnimationFrame(rafId); allOff(); setPlaying(false); drawPlayhead(null); log('Panic sent.'); });

window.addEventListener('resize', ()=>{ if(song){ sizeCanvas(); drawRoll(); } });

(async ()=>{
  try{ await initWasm(); } catch(e){ log('Failed to load wasm (serve over http, not file://): '+e.message); return; }
  if(!navigator.requestMIDIAccess){ log('This browser has no Web MIDI API (use Chrome/Edge).'); return; }
  await initMidi();
})();
</script>
</body>
</html>
